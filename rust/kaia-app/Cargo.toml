[package]
name = "kaia-app"
description = "The Kaia app: main loop, navigation, surfaces and services, and the kaia binary."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints.rust]
unsafe_code = "forbid"

[[bin]]
name = "kaia"
path = "src/main.rs"

[features]
default = ["desktop", "lua"]
lua = ["dep:kaia-lua"]
desktop = ["kaia-display/desktop"]
kobo = ["kaia-display/kobo"]

[dependencies]
kaia-lua = { path = "../kaia-lua", optional = true }
kaia-book = { path = "../kaia-book" }
kaia-dict = { path = "../kaia-dict" }
kaia-stats = { path = "../kaia-stats" }
kaia-sync = { path = "../kaia-sync" }
kaia-opds = { path = "../kaia-opds" }
kaia-id = { path = "../kaia-id" }
kaia-display = { path = "../kaia-display", default-features = false }
kaia-doc = { path = "../kaia-doc" }
kaia-events = { path = "../kaia-events" }
kaia-gfx = { path = "../kaia-gfx" }
kaia-input = { path = "../kaia-input" }
kaia-library = { path = "../kaia-library" }
# Build script only: the binary and the tests need MuPDF's library directories (see build.rs).
kaia-mupdf-sys = { path = "../kaia-mupdf-sys" }
kaia-platform = { path = "../kaia-platform" }
kaia-ui = { path = "../kaia-ui" }

[dev-dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }

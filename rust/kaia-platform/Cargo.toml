[package]
name = "kaia-platform"
description = "Device services: battery, frontlight and warmth, suspend and standby, Wi-Fi, USB storage handover, device info and paths."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]

# Only the ioctl module (RTC alarm, ntx_io frontlight) calls into libc.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[package]
name = "kaia-library"
description = "Library scanner and SQLite index: books, metadata, covers, collections, search."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints.rust]
unsafe_code = "forbid"

[dependencies]
kaia-platform = { path = "../kaia-platform" }
kaia-id = { path = "../kaia-id" }
kaia-doc = { path = "../kaia-doc" }
kaia-gfx = { path = "../kaia-gfx" }
kaia-luadata = { path = "../kaia-luadata" }
# Build script only: test binaries need MuPDF's library directories (see build.rs).
kaia-mupdf-sys = { path = "../kaia-mupdf-sys" }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
md-5 = "0.11"
roxmltree = "0.21"
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
thiserror = "2"
# Folds Latin accents for suggestions, as the FTS5 unicode61 tokenizer does.
unicode-normalization = "0.1"
# Reads EPUB entries with plain deflate only. The `deflate` feature also builds
# zopfli, which only compresses.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile = "3"

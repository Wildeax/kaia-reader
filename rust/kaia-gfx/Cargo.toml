[package]
name = "kaia-gfx"
description = "Pixmaps, geometry, drawing, text and images for the Kaia UI."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# Pure Rust shaping and layout. The fontconfig feature is off: fonts come
# from directories the caller passes in, never from the system.
cosmic-text = { version = "0.17", default-features = false, features = ["std", "swash"] }
# PNG and JPEG only. Decoding and encoding stay pure Rust.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# SVG icons. resvg re-exports usvg and tiny-skia, so their versions match.
resvg = { version = "0.45", default-features = false }
unicode-script = "0.5"
# Font files are mapped, not read, so large script fonts cost RAM only when used.
memmap2 = "0.9"

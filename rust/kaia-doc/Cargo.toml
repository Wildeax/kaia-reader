[package]
name = "kaia-doc"
description = "Document trait and engine backends."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# CREngine backend for EPUB, FB2, HTML, TXT, RTF, DOC and CHM. It needs a
# KOReader desktop build (see kaia-cre-sys). Build with --no-default-features
# for targets without that build.
default = ["cre", "djvu"]
djvu = ["dep:kaia-djvu-sys"]
cre = ["dep:kaia-cre-sys"]

[dependencies]
kaia-gfx = { path = "../kaia-gfx" }
kaia-mupdf-sys = { path = "../kaia-mupdf-sys" }
kaia-cre-sys = { path = "../kaia-cre-sys", optional = true }
kaia-djvu-sys = { path = "../kaia-djvu-sys", optional = true }

[dev-dependencies]
serde_json = "1"

[[example]]
name = "cre_snapshot"
required-features = ["cre"]

[package]
name = "kaia-dict"
description = "Local StarDict and Kobo dictionary lookup, with opt-in verified downloads."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
flate2 = "1.1"
regex = "1"
url = "2"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tar = "0.4"
zstd = "0.13"
tempfile = "3"
ureq = { version = "3.4", default-features = false, features = ["rustls"] }

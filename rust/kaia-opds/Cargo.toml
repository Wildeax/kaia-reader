[package]
name = "kaia-opds"
description = "OPDS catalog browsing, search and downloads."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints.rust]
unsafe_code = "forbid"

[features]
default = ["tls"]
# HTTPS through rustls with the Mozilla root certificates (webpki-roots). Without
# it the client speaks plain HTTP only and refuses https:// addresses.
tls = ["ureq/rustls"]

[dependencies]
base64 = "0.22"
quick-xml = "0.41"
serde_json = "1"
thiserror = "2"
ureq = { version = "3.4", default-features = false }
url = "2"

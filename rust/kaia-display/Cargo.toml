[package]
name = "kaia-display"
description = "Display and input-source traits with a desktop window backend and a headless backend."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["desktop"]
# Desktop window through minifb. The armv7 device build turns it off.
desktop = ["dep:minifb"]
# Native HWTCON display, evdev and kernel device events.
kobo = ["dep:libc", "dep:kaia-fbink-sys"]
# Optional comparison backend. Needs KAIA_FBINK_LIB and an IMAGE=1 build.
fbink = ["kobo"]

[dependencies]
kaia-gfx = { path = "../kaia-gfx" }
kaia-input = { path = "../kaia-input" }
kaia-fbink-sys = { path = "../kaia-fbink-sys", optional = true }
libc = { version = "0.2", optional = true }
minifb = { version = "0.29", optional = true }

[[example]]
name = "hello_window"
required-features = ["desktop"]

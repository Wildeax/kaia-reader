[package]
name = "kaia-sync"
description = "Reading progress sync with KOReader's sync server protocol."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints.rust]
unsafe_code = "forbid"

[features]
default = ["tls"]
# HTTPS through rustls with the Mozilla root certificates (webpki-roots). Without
# it the client speaks plain HTTP only and refuses https:// server addresses.
tls = ["ureq/rustls"]

[dependencies]
kaia-id = { path = "../kaia-id" }
md-5 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ureq = { version = "3.4", default-features = false }

[package]
name = "kaia-ffi"
description = "C ABI of libkaia, called from LuaJIT through ffi.load."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "kaia"
crate-type = ["cdylib", "rlib"]

[features]
# Enables kaia_debug_panic, a test-only export that panics on purpose.
test-panic = []
# Kobo build: provides symbols that Rust std needs but glibc 2.15 lacks.
glibc215 = ["dep:kaia-glibc-compat"]

[dependencies]
kaia-core = { path = "../kaia-core" }
kaia-storage = { path = "../kaia-storage" }
serde = "1"
serde_json = "1"
kaia-glibc-compat = { path = "../kaia-glibc-compat", optional = true, features = ["glibc215"] }

[dev-dependencies]
proptest = "1"
regex = "1"
tempfile = "3"

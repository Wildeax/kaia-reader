[workspace]
resolver = "2"
members = [
    "kaia-core",
    "kaia-storage",
    "kaia-ffi",
    "kaia-gfx",
    "kaia-events",
    "kaia-input",
    "kaia-luadata",
    "kaia-mupdf-sys",
    "kaia-doc",
    "kaia-display",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
rust-version = "1.89"

[profile.release]
panic = "unwind"
lto = "thin"
opt-level = "s"

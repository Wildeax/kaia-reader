name: kaia-rust

# Gates the libkaia Cargo workspace in rust/. Runs for pull requests from forks
# with a read-only token and no secrets.

on:
  push:
    branches: [main]
    paths: ['rust/**', '.github/workflows/kaia-rust.yml']
  pull_request:
    paths: ['rust/**', '.github/workflows/kaia-rust.yml']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  test:
    name: fmt, clippy and test
    runs-on: ubuntu-24.04
    env:
      PURE_CRATES: -p kaia-core -p kaia-storage -p kaia-ffi -p kaia-gfx -p kaia-events -p kaia-input -p kaia-luadata -p kaia-ui -p kaia-platform -p kaia-dict -p kaia-id -p kaia-sync -p kaia-fbink-sys -p kaia-stats -p kaia-opds -p kaia-calibre -p kaia-i18n -p kaia-glibc-compat
    timeout-minutes: 30
    steps:

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # kaia-i18n reads the gettext catalogs in l10n. kaia-gfx and kaia-ui read
      # the Noto fonts in resources/fonts, and their tests fail without them.
      # Fetch these two submodules only, shallow, at the commits the
      # superproject pins. The other submodules belong to the native build in
      # kaia-lua.yml.
      - name: Fetch l10n and font submodules
        run: |
          set -euo pipefail
          git submodule update --init --depth 1 -- l10n resources/fonts
          git submodule status -- l10n resources/fonts

      # The l10n submodule tracks .po sources, not the .mo files that the
      # parser tests compare with them. Compile every catalog for those tests.
      - name: Compile gettext catalogs
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gettext
          for po in l10n/*/koreader.po; do
            msgfmt -o "${po%.po}.mo" "${po}"
          done

      # The channel comes from rust/rust-toolchain.toml, so the toolchain
      # version is set in one place.
      - name: Install toolchain
        run: |
          set -euo pipefail
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust/rust-toolchain.toml)"
          test -n "${channel}"
          rustup toolchain install "${channel}" --profile minimal --component rustfmt --component clippy
          cd rust
          rustup show active-toolchain
          cargo --version

      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "rust -> target"

      - name: Format
        working-directory: rust
        run: cargo fmt --all -- --check

      # Crates that link KOReader's native build (kaia-mupdf-sys, kaia-cre-sys,
      # kaia-djvu-sys, kaia-doc, kaia-library, kaia-book, kaia-lua, kaia-app)
      # are tested in the kaia-lua emulator job, which builds those libraries.
      # kaia-display is checked without its desktop window, which minifb opens
      # through X11 or Wayland at run time. Its Kobo feature is tested but not
      # linted here, because the tests link without FBInk and never call it.
      - name: Clippy
        working-directory: rust
        run: |
          cargo clippy --locked --all-targets ${PURE_CRATES} -- -D warnings
          cargo clippy --locked --all-targets -p kaia-ffi --features test-panic -- -D warnings
          cargo clippy --locked --all-targets -p kaia-display --no-default-features -- -D warnings

      - name: Test
        working-directory: rust
        run: |
          cargo test --locked ${PURE_CRATES}
          cargo test --locked -p kaia-ffi --features test-panic
          cargo test --locked -p kaia-display --no-default-features
          cargo test --locked -p kaia-display --no-default-features --features kobo

  deny:
    name: cargo deny
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Release binary from GitHub, checked against the SHA-256 of the asset.
      - name: Install cargo-deny
        run: |
          set -euo pipefail
          version=0.20.2
          archive="${RUNNER_TEMP}/cargo-deny.tar.gz"
          curl -fsSL -o "${archive}" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${version}/cargo-deny-${version}-x86_64-unknown-linux-musl.tar.gz"
          echo "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/cargo-deny-${version}-x86_64-unknown-linux-musl" >> "${GITHUB_PATH}"

      - name: Check licenses and advisories
        working-directory: rust
        run: |
          cargo-deny --version
          cargo deny check licenses advisories
